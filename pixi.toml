[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "requests"
platforms = ["linux-64", "osx-arm64"]
version = "2.0.0"


[tasks]
run = "bash build_and_run.sh main.mojo"
test = "bash -c 'python test_server.py & python test_proxy_server.py & sleep 1 && bash build_and_run.sh test_client.mojo; RET=$?; kill %1 %2 2>/dev/null; exit $RET'"
test-hpack = "bash build_and_run.sh test_hpack.mojo"
test-h2 = "bash build_and_run.sh test_h2.mojo"
test-h2-conn = "bash build_and_run.sh test_h2_conn.mojo"
test-h2-client = "bash build_and_run.sh test_h2_client.mojo"
test-std-compat = "bash build_and_run.sh test_std_compat.mojo"
test-alpn = "bash -c 'mkdir -p .build/alpn && openssl req -x509 -newkey rsa:2048 -nodes -keyout .build/alpn/key.pem -out .build/alpn/cert.pem -days 1 -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 2>/dev/null && (python alpn_test_server.py .build/alpn/cert.pem .build/alpn/key.pem &) && sleep 1 && bash build_and_run.sh test_alpn_fallback.mojo; RET=$?; pkill -f alpn_test_server.py; exit $RET'"
format = "mblack http_client.mojo main.mojo test_client.mojo"

[dependencies]
mojo = ">=1.2.0"
brotli = ">=1.0"
zstd = ">=1.5"

[pypi-dependencies]
brotli = ">=1.0"
zstandard = ">=0.22"
