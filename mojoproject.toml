[package]
name = "requests"
version = "1.2.2"
description = "Pure-Mojo HTTP/1.1 client with TLS support"
license = "MIT"
platforms = ["linux-64", "osx-arm64"]

[mojo]
requires = ">=1.0.0"

[dependencies]
tls  = { git = "Mosaad-M/tls",      version = ">=1.4.4" }
tcp  = { git = "Mosaad-M/tcp",      version = ">=1.1.0" }
url  = { git = "Mosaad-M/url",      version = ">=1.1.0" }
json = { git = "Mosaad-M/json",     version = ">=3.0.1" }
