name: Fuzz (nightly)
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Inputs per target"
        default: "300000"

jobs:
  fuzz:
    # Random seed each night (printed below; a failure prints the command that
    # reproduces it).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install mojo-pkg
        run: |
          mkdir -p "$HOME/.mojo/bin"
          curl -fsSL https://github.com/Mosaad-M/mojo-pkg/releases/latest/download/mojo-pkg-linux-64.tar.gz \
            | tar xz -C "$HOME/.mojo/bin"
          echo "$HOME/.mojo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          LD_LIBRARY_PATH="$(pwd)/.pixi/envs/default/lib" \
            $HOME/.mojo/bin/mojo-pkg install

      - name: Fuzz
        run: |
          SEED=$(( $(date +%s) % 1000000007 ))
          echo "seed $SEED"
          pixi run fuzz "${{ github.event.inputs.iterations || '300000' }}" "$SEED"
