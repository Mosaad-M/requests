name: Mojo nightly (weekly)
# Builds and tests against the newest Mojo nightly, so a compiler change that
# breaks us (e.g. String.find() returning Optional[Int], #65) shows up here
# before it reaches a stable release. Not part of the PR checks.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check CPU features
        run: |
          grep -q avx2 /proc/cpuinfo     || { echo "MISSING: avx2 — re-queue this job"; exit 1; }

      # pixi.lock pins the stable channel; resolve afresh against the nightly one.
      - name: Point pixi at the nightly channel
        run: sed -i 's#https://conda.modular.com/max"#https://conda.modular.com/max-nightly"#' pixi.toml

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: false

      - name: Mojo version
        run: pixi run mojo --version

      - name: Install mojo-pkg
        run: |
          mkdir -p "$HOME/.mojo/bin"
          curl -fsSL https://github.com/Mosaad-M/mojo-pkg/releases/latest/download/mojo-pkg-linux-64.tar.gz \
            | tar xz -C "$HOME/.mojo/bin"
          echo "$HOME/.mojo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          LD_LIBRARY_PATH="$(pwd)/.pixi/envs/default/lib" \
            $HOME/.mojo/bin/mojo-pkg install

      - name: Run tests
        run: pixi run test

      - name: HTTP/2 unit tests
        run: |
          pixi run test-hpack
          pixi run test-h2

      - name: HTTP/2 local-server tests
        run: pixi run test-h2-local

      - name: ALPN fallback
        run: pixi run test-alpn

      - name: Std compatibility
        run: pixi run test-std-compat

      - name: Fuzz
        run: pixi run fuzz 50000 1 2
